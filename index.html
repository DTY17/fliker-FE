<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flicker — a small, well-kept film library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap site-bar">
    <div class="logo" onclick="go('home')" style="cursor:pointer;">Flicker<span class="dot">.</span></div>
    <div class="search-shell">
      <input id="headerSearch" type="text" placeholder="Search titles, directors, genres…" onkeydown="if(event.key==='Enter')submitSearch()">
      <button onclick="submitSearch()">Search</button>
    </div>
    <div class="nav-auth" id="navAuth"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="site">
  <div class="wrap footer-row">
    <span class="brand">Flicker</span>
    <span>A small, well-kept film library. <span class="demo-flag" id="demoFlag"></span></span>
  </div>
</footer>

<div id="toastRoot"></div>

<script src="js/app.js"></script>
</body>
</html>
